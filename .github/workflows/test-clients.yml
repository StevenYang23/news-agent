name: Test yt-dlp clients

on:
  workflow_dispatch:

jobs:
  test-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yt-dlp

      - name: Run client diagnostic
        run: python scripts/test_clients.py
