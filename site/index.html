<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketIntel — US Stock News, Summarized</title>
  <link rel="icon" type="image/svg+xml" href="marketintel-icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo-img" src="marketintel-icon.svg" alt="MarketIntel" />
      <div class="brand-text">
        <h1 class="brand-name">Market<span class="brand-intel">Intel</span></h1>
        <p class="tagline">US Stock News, Summarized</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="sources-btn" id="sourcesBtn">来源</button>
      <div class="lang-toggle" id="globalLang">
        <button class="active" data-lang="zh">中</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="meta" id="metaInfo"></div>
    </div>
  </header>

  <nav class="datebar">
    <button class="nav-btn" id="prevDay" aria-label="前一天">‹</button>
    <div class="date-display">
      <span id="dateLabel">—</span>
      <span class="count-badge" id="countBadge">0 条</span>
    </div>
    <button class="nav-btn" id="nextDay" aria-label="后一天">›</button>
    <button class="today-btn" id="todayBtn">最新</button>
  </nav>

  <div class="filters">
    <div class="chips" id="catChips">
      <button class="chip active" data-cat="">全部</button>
      <button class="chip" data-cat="macro">宏观</button>
      <button class="chip" data-cat="tech">科技</button>
      <button class="chip" data-cat="politics">政治</button>
      <button class="chip" data-cat="volatility">波动率</button>
      <button class="chip" data-cat="other">其他</button>
      <button class="chip" data-cat="bbg-tv-news">BBG TV</button>
    </div>
    <input type="search" id="searchInput" placeholder="搜索摘要 / 标题 / 股票 / 关键词…" />
  </div>

  <main id="grid" class="grid">
    <div class="state" id="state">加载中…</div>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <span>数据来源为公开买方研报与播客，仅供研究参考，不构成投资建议。</span>
      <span id="lastUpdated"></span>
    </div>
    <div class="footer-right">
      <img class="footer-logo" src="marketintel-logo.svg" alt="MarketIntel" />
      <span class="made-by">Made by Steven Yang</span>
    </div>
  </footer>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <img class="modal-logo" src="marketintel-logo.svg" alt="MarketIntel" />
        <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      </div>
      <span class="modal-src" id="modalSrc"></span>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-sub" id="modalSub"></p>
      <div class="lang-toggle" id="modalLang">
        <button class="active" data-lang="zh">中</button>
        <button data-lang="en">EN</button>
      </div>
      <p class="modal-detail" id="modalDetail"></p>
      <ul class="keypoints" id="modalPoints"></ul>
      <div class="chips-row" id="modalChips"></div>
      <a class="modal-link" id="modalLink" target="_blank" rel="noopener">查看原文 →</a>
    </div>
  </div>

  <div class="modal-overlay" id="sourcesModal" hidden>
    <div class="modal modal-sources">
      <div class="modal-head">
        <h2 class="modal-title" style="margin:0">数据来源</h2>
        <button class="modal-close" id="sourcesClose" aria-label="关闭">✕</button>
      </div>
      <ul class="sources-list" id="sourcesList"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
